    <title>Album Kenangan X RPL </title>
    <script>
      // Dijalankan paling awal, sebelum apa pun lain dimuat, supaya browser tidak sempat
      // me-restore posisi scroll dari kunjungan sebelumnya atau melompat ke #hash lama.
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual'
      }
      if (window.location.hash) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search)
      }
    </script>
